[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-agent"
version = "0.0.1"
description = "LLM-powered stock research assistant (research/education only; not financial advice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "truongbnguyen88" }]

# Core runtime deps only. Heavier deps (pandas, numpy, yfinance, anthropic,
# scikit-learn, lightgbm, typer, httpx, ...) are added in the phase that
# first needs them — keeps installs light and the dependency surface honest.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    # Phase 1 — data layer
    "httpx>=0.27",       # HTTP client for REST providers (Finnhub/Marketaux/AlphaVantage)
    "yfinance>=0.2.40",  # keyless historical price source
    "pandas>=2.2",       # yfinance returns DataFrames; used at the provider boundary
    "lxml>=5.0",         # required by yfinance get_earnings_dates (earnings history)
    # Phase 3 — LLM (Role A news summarizer)
    "anthropic>=0.40",   # Claude API client (news summarization; prompt caching)
    # Phase 4 — CLI
    "typer>=0.12",       # CLI framework (analyze/forecast/backtest commands)
    # Phase 5 — ML models.
    # Pinned to a single minor band: models are trained in CI and pickled, then
    # `make pull-models` deserializes them locally. A minor-version skew between
    # CI and local makes sklearn emit InconsistentVersionWarning and risks silently
    # wrong loads, so the serialization-sensitive deps must match on both sides.
    "scikit-learn>=1.9,<1.10", # logistic regression, imputation, isotonic calibration
    "lightgbm>=4.6,<5",        # gradient-boosted classifier (tuned big-move model)
    "joblib>=1.5,<2",          # the pickler for the trained artifacts (train/serve parity)
    "hmmlearn>=0.3,<0.4",      # Gaussian HMM for the regime forecaster (Task 8 spike)
    # UI
    "streamlit>=1.35",   # browser-based chat frontend
    # Export (chat summary -> document)
    "fpdf2>=2.7",        # pure-Python PDF (no cairo/pango/LaTeX system deps)
    "python-docx>=1.1",  # pure-Python DOCX
    "vl-convert-python>=1.0",  # Vega-Lite -> PNG for chart images in exports (no browser)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
# Console entry point. The real CLI app arrives in Phase 4 (cli/app.py); until
# then this dispatches to the placeholder in __main__.
stock-agent = "stock_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import sort, UP: pyupgrade,
# B: bugbear, SIM: simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# Third-party libs without (complete) type stubs. We normalize their outputs to
# typed domain models at the provider boundary, so untyped imports stop there.
[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas.*", "sklearn.*", "lightgbm.*", "joblib.*", "hmmlearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import from src directly so the suite does not depend on the editable-install
# .pth being honored (some interpreter/sandbox setups do not process .pth files).
pythonpath = ["src"]
