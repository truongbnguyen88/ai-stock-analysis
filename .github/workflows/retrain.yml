name: Monthly model retrain

# Retrains the production toolkit (logistic + tuned lightgbm × 20/30/60, calibrated)
# in CI and publishes the artifacts to a rolling GitHub Release. Pull them locally
# with `make pull-models` — the app serves from outputs/models/ (gitignored), so the
# repo never carries the ~100MB of binaries.

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC
  workflow_dispatch: {} # allow manual runs (Actions tab → Run workflow)

permissions:
  contents: write # publish the model release

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # cv=3 lightgbm + a one-time Form 4 warm over the universe
    env:
      # The `insider` feature group (config: model_feature_groups) needs EDGAR access.
      # Set this repo secret to a descriptive UA per SEC fair-access (e.g.
      # "your-app you@example.com"). Absent it, insider columns train as NaN (degraded,
      # not broken) — set it so the published models actually carry the insider signal.
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive — reset the 60-day schedule-disable timer
        # GitHub auto-disables a scheduled workflow after 60 days with no repo
        # activity. A push on every monthly trigger (~30 days < 60) keeps it
        # "active" hands-off. Placed before training so a failed/slow retrain
        # still resets the timer. GITHUB_TOKEN pushes don't re-trigger workflows,
        # so there's no recursion ([skip ci] is belt-and-suspenders).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-retrain.txt
          git add .github/last-retrain.txt
          git commit -m "chore(ci): monthly retrain keepalive [skip ci]" || exit 0
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e . # prices are keyless (yfinance); insider needs SEC_USER_AGENT (above)

      - name: Warm insider (Form 4) cache
        # Pre-download the universe's Form 4 XML once via the pooled-client + retry warmer
        # (avoids EDGAR fair-access throttling); training then reads it from cache. Skips
        # cleanly if SEC_USER_AGENT is unset (training proceeds with NaN insider columns).
        run: |
          if [ -n "$SEC_USER_AGENT" ]; then
            python scripts/warm_insider_cache.py --universe configs/universe.txt
          else
            echo "SEC_USER_AGENT unset — skipping insider warm (insider features will be NaN)"
          fi

      - name: Train calibrated toolkit
        run: python -m stock_agent train --all

      - name: Conformal-calibrate prediction intervals
        # Pooled split-conformal correction so served CIs/VaR have honest coverage.
        # Tracks the freshly-trained models (~6 min) → outputs/models/conformal.json.
        run: python -m stock_agent conformal-calibrate

      - name: Verify artifacts (promote gate)
        # Gates BOTH the pooled models and the conformal artifact (present in CI).
        run: python -m stock_agent verify-models

      - name: Package models
        run: |
          cd outputs/models
          tar -czf "$GITHUB_WORKSPACE/models.tar.gz" *.joblib conformal.json
          ls -lh "$GITHUB_WORKSPACE/models.tar.gz"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse --short HEAD)
          NOTES="Calibrated pooled models (logistic + tuned lightgbm × 20/30/60) + conformal interval-corrections (conformal.json), trained ${DATE} from ${SHA}. Pull with: make pull-models"
          # Rolling 'models-latest' (what `make pull-models` fetches) — recreate it.
          gh release delete models-latest --yes --cleanup-tag || true
          gh release create models-latest models.tar.gz --title "models-latest (${DATE})" --notes "${NOTES}"
          # Dated snapshot for history / rollback (best-effort).
          gh release create "models-${DATE}" models.tar.gz --title "models ${DATE}" --notes "${NOTES}" || true
